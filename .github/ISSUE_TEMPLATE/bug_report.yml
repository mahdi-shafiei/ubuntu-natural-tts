name: Bug report
description: Something is silent, wrong or broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `natural-tts doctor`
      render: text
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution and version
      placeholder: Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: desktop
    attributes:
      label: Desktop and session
      options:
        - GNOME on Wayland
        - GNOME on X11
        - KDE Plasma
        - Other (describe above)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >-
        For example `journalctl --user -u natural-tts-kokoro.service -n 50`
        or `journalctl --user -u natural-tts-piper.service -n 50`.
      render: text
