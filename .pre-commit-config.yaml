repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-executables-have-shebangs

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        # Paths and strictness come from [tool.mypy] in pyproject.toml.
        args: []
        pass_filenames: false
        additional_dependencies: [pytest>=8, numpy>=1.26]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      # Runs in the project environment: `uv run pre-commit run --all-files`
      - id: pytest
        name: pytest (with coverage gate)
        entry: python -m pytest
        language: system
        pass_filenames: false
        always_run: true
