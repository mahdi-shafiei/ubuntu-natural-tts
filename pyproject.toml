[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "natural-tts"
version = "0.1.0"
description = "Natural-sounding, system-wide text-to-speech for Ubuntu (Piper + Kokoro)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Mahdi Shafiei" }]
# Kokoro (and its phonemizer) declare Requires-Python < 3.13.
requires-python = ">=3.11,<3.13"
keywords = ["tts", "text-to-speech", "ubuntu", "gnome", "piper", "kokoro",
            "speech-dispatcher", "accessibility"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# The core package uses only the standard library, so the commands that run
# for every sentence (Speech Dispatcher's synth command) start fast.
dependencies = []

[project.optional-dependencies]
piper = ["piper-tts[http]>=1.8"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.17", "mypy>=2.4",
       "pre-commit>=4"]

[project.urls]
Homepage = "https://github.com/mahdi-shafiei/ubuntu-natural-tts"
Issues = "https://github.com/mahdi-shafiei/ubuntu-natural-tts/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/natural_tts"]

[tool.ruff]
line-length = 80
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN", "D"]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=natural_tts --cov-report=term-missing"
markers = ["integration: needs real system tools (speech-dispatcher, piper)"]

[tool.coverage.run]
branch = true
source = ["natural_tts"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError",
                "if __name__ == .__main__.:"]
