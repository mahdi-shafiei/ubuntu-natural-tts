[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "natural-tts"
version = "0.6.0"
description = "Natural-sounding, system-wide text-to-speech for Ubuntu (Piper + Kokoro)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Mahdi Shafiei" }]
# Kokoro (and its phonemizer) declare Requires-Python < 3.13.
requires-python = ">=3.11,<3.13"
keywords = ["tts", "text-to-speech", "ubuntu", "gnome", "piper", "kokoro",
            "speech-dispatcher", "accessibility"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# The core package uses only the standard library, so the commands that run
# for every sentence (Speech Dispatcher's synth command) start fast.
dependencies = []

[project.optional-dependencies]
piper = ["piper-tts[http]>=1.8"]
# markdown-it-py (MIT) and Pygments (BSD-2) read Markdown structure and
# code on the hotkey path; both are pure Python and imported lazily.
kokoro = ["kokoro>=0.9.4", "sounddevice>=0.5", "soundfile>=0.12",
          "numpy>=1.26", "markdown-it-py>=4,<5", "Pygments>=2.19",
          "latex2mathml>=3.81,<4"]
dev = ["pyyaml>=6", "pytest>=8", "pytest-cov>=5", "ruff>=0.17", "mypy>=2.4", "numpy>=1.26",
       "pre-commit>=4", "markdown-it-py>=4,<5", "Pygments>=2.19",
       "latex2mathml>=3.81,<4"]

[project.scripts]
natural-tts = "natural_tts.cli:main"

[project.urls]
Homepage = "https://github.com/mahdi-shafiei/ubuntu-natural-tts"
Issues = "https://github.com/mahdi-shafiei/ubuntu-natural-tts/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/natural_tts"]

[tool.ruff]
line-length = 80
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN", "D"]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
# Spoken-form tables and rules are written in the symbols they handle.
"src/natural_tts/reading/tables.py" = ["RUF001"]
"src/natural_tts/reading/normalize.py" = ["RUF001"]
"src/natural_tts/reading/math.py" = ["RUF001"]
"src/natural_tts/reading/intent.py" = ["RUF001"]
"src/natural_tts/reading/biology.py" = ["RUF001"]
"scripts/generate_units.py" = ["RUF001"]
"src/natural_tts/reading/data/units.py" = ["RUF001"]
"tests/reading/*.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["kokoro", "kokoro.*", "sounddevice", "numpy", "numpy.*",
          "markdown_it", "markdown_it.*", "pygments", "pygments.*",
          "latex2mathml", "latex2mathml.*",
    "misaki",
    "misaki.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=natural_tts --cov-report=term-missing"
markers = ["integration: needs real system tools (speech-dispatcher, piper)"]

[tool.coverage.run]
branch = true
source = ["natural_tts"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError",
                "if __name__ == .__main__.:"]
