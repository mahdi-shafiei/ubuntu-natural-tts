# Pronunciations neither engine gets right on its own. Phonemes use misaki's
# American alphabet (A = /eɪ/, I = /aɪ/, O = /oʊ/, W = /aʊ/, Y = /ɔɪ/).
# Sources: Wiktionary and the UMN Duluth microbiology pronunciation guide,
# read as references; the project writes its own table (see decisions).
# `match` is "ci" (default) or "exact"; `words` rewrites text instead.

